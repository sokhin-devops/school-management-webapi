spring.application.name=school-management-webapi
server.port=8081

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/school-management-webdb
spring.datasource.username=postgres
spring.datasource.password=underadmin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT Configuration
# app.jwt.secret must be overridden via the JWT_SECRET env var in production (>= 256-bit key).
app.jwt.secret=${JWT_SECRET:8f42a1c9d3e67b0159af7c24d8e93b6015af9c3e7d2b4816f0a9c3e5d7b1a4f}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000